<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>My Timetable</title>
    </head>
    <body>
        <h2>ჩემი ცხრილი</h2>
        <table border="1" cellpadding="10">
            <thead>
            <tr>
                <th>დღე</th>
                <th>საგანი</th>
                <th>მასწავლებელი</th>
                <th>ოთახი</th>
                <th>დაწყების დრო</th>
                <th>დასრულების დრო</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lesson : ${timetable}">
                <td th:text="${lesson.dayOfWeek}"></td>
                <td th:text="${lesson.subjectName}"></td>
                <td th:text="${lesson.teacherName}"></td>
                <td th:text="${lesson.roomNumber}"></td>
                <td th:text="${lesson.startTime}"></td>
                <td th:text="${lesson.endTime}"></td>
            </tr>
            </tbody>
        </table>
        <a href="/dashboard">პროფილი</a>
    </body>
</html>
