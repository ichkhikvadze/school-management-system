<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>My Timetable</title>
    </head>
    <body>
        <h2>ჩემი ცხრილი</h2>
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>ჯგუფი</th>
                    <th>საგანი</th>
                    <th>დღე</th>
                    <th>დაწყების დრო</th>
                    <th>დასრულების დრო</th>
                    <th>ოთახი</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${timetable}">
                    <td th:text="${entry.groupName}"></td>
                    <td th:text="${entry.subjectName}"></td>
                    <td th:text="${entry.dayOfWeek}"></td>
                    <td th:text="${entry.startTime}"></td>
                    <td th:text="${entry.endTime}"></td>
                    <td th:text="${entry.roomNumber}"></td>
                </tr>
            </tbody>
        </table>
        <a href="/dashboard">პროფილი</a>
    </body>
</html>
