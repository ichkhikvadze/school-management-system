<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Student Grades</title>
    </head>
    <body>
        <h2>მოსწავლის ნიშნები</h2>

        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>საგანი</th>
                    <th>ნიშნის ტიპი</th>
                    <th>ქულა</th>
                    <th>მაქსიმალური ქულა</th>
                    <th>მასწავლებელი</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="grade : ${grades}">
                    <td th:text="${grade.subjectName}"></td>
                    <td th:text="${grade.gradeType}"></td>
                    <td th:text="${grade.score}"></td>
                    <td th:text="${grade.maxScore}"></td>
                    <td th:text="${grade.teacherName}"></td>
                </tr>
            </tbody>
        </table>

        <br>

        <a th:href="@{/teacher/groups}">ჯგუფები</a>
    </body>
</html>
