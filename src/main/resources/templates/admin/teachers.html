<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Teachers</title>
    </head>
    <body>
        <h2>Teachers</h2>

        <a href="/dashboard">Dashboard</a>

        <!-- SEARCH -->

        <form th:action="@{/admin/teachers}" method="get">
            <input type="text"
                   name="search"
                   th:value="${search}"
                   placeholder="Search by first or last name">
            <button type="submit">Search</button>
        </form>

        <br>

        <!-- TABLE -->

        <table border="1" cellpadding="10">
            <thead>
            <tr>
                <th>Username</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Qualification</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.username}"></td>
                <td th:text="${teacher.firstName}"></td>
                <td th:text="${teacher.lastName}"></td>
                <td th:text="${teacher.qualification}"></td>
            </tr>
            </tbody>
        </table>

        <br>

        <!-- PAGINATION -->

        <div>

            <!-- PREVIOUS -->

            <a th:if="${currentPage > 0}"
               th:href="@{/admin/teachers(
                    page=${currentPage - 1},
                    size=10,
                    search=${search}
               )}">
                Previous
            </a>

            <!-- PAGE NUMBERS -->

            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/admin/teachers(
                        page=${i},
                        size=10,
                        search=${search}
                    )}"

                   th:text="${i + 1}"

                   th:style="${i == currentPage}
                        ? 'font-weight:bold'
                        : ''">
                </a>

            </span>

            <!-- NEXT -->

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/teachers(
                    page=${currentPage + 1},
                    size=10,
                    search=${search}
               )}">
                Next
            </a>
        </div>
    </body>
</html>
