<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
</head>
<body>
    <h2>მომხმარებლის რეგისტრაცია</h2>

    <form th:action="@{/admin/users}" method="post" th:object="${user}">

        <input type="text" th:field="*{username}" placeholder="Username"/><span>იუზერნეიმი</span><br>
        <input type="password" th:field="*{password}" placeholder="Password"/><span>პაროლი</span><br>
        <input type="email" th:field="*{email}" placeholder="Email"/><span>მეილი</span><br>
        <input type="text" th:field="*{firstName}" placeholder="First Name"/><span>სახელი</span><br>
        <input type="text" th:field="*{lastName}" placeholder="Last Name"/><span>გვარი</span><br>

        <select th:field="*{role}" id="roleSelect" onchange="toggleFields()">
            <option value="">აირჩიე როლი</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>

        <!-- Student Fields -->
        <div id="studentFields" style="display:none;">
            <h3>სტუდენტის ინფორმაცია</h3>
            <input type="date" th:field="*{birthDate}" placeholder="dd/MM/yyyy"/><span>დაბადების თარიღი</span><br>
            <input type="text" th:field="*{address}" placeholder="Address"/><span>მისამართი</span><br>
            <input type="text" th:field="*{parentName}" placeholder="Parent Name"/><span>მშობლის სახელი/გვარი</span><br>
            <input type="text" th:field="*{parentContact}" placeholder="Parent Contact"/><span>მშობლის საკონტაქტო</span><br>
            <input type="date" th:field="*{admissionDate}" placeholder="dd/MM/yyyy"/><span>მიღების თარიღი</span><br>
        </div>

        <!-- Teacher Fields -->
        <div id="teacherFields" style="display:none;">
            <h3>მასწავლებლის ინფორმაცია</h3>
            <input type="date" th:field="*{hireDate}" placeholder="dd/MM/yyyy"/><span>მიღების თარიღი</span><br>
            <input type="number" step="0.01" th:field="*{salary}" placeholder="Salary"/><span>ანაზღაურება</span><br>
            <input type="text" th:field="*{qualification}" placeholder="Qualification"/><span>კვალიფიკაცია</span><br>
        </div>

        <button type="submit">მომხმარებლის შექმნა</button>
    </form>

    <script>
        function toggleFields() {
            const role = document.getElementById("roleSelect").value;
            document.getElementById("studentFields").style.display =
                role === "STUDENT" ? "block" : "none";
            document.getElementById("teacherFields").style.display =
                role === "TEACHER" ? "block" : "none";
        }
    </script>

    <a href="/dashboard">პროფილი</a>
    </body>

</html>
