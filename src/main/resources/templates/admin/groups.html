<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Group Management</title>
    </head>
    <body>

    <h2>ჯგუფების მენეჯმენტი</h2>

    <div th:if="${success}" style="padding:10px; background:#d4edda; color:#155724; margin-bottom:15px;">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" style="padding:10px; background:#f8d7da; color:#721c24; margin-bottom:15px;">
        <span th:text="${error}"></span>
    </div>

    <h3>ჯგუფის შექმნა</h3>
    <form th:action="@{/admin/groups/create}" method="post">
        <input type="text" name="name" placeholder="ჯგუფის სახელი"/>
        <input type="number" name="gradeLevel" placeholder="სასწავლო საფეხური"/>
        <input type="text" name="academicYear" placeholder="აკადემიური წელი"/>
        <button type="submit">შექმნა</button>
    </form>

    <hr>

    <h3>არსებული ჯგუფები</h3>
    <div th:each="group : ${groups}">
        <p>
            <strong th:text="${group.name}"></strong>
            (Grade <span th:text="${group.gradeLevel}"></span>)
        </p>
    </div>

    <hr>

    <h3>ცხრილის შექმნა</h3>
    <form th:action="@{/admin/groups/timetable/create}" method="post">
        <input type="text" name="groupName" placeholder="ჯგუფის სახელი"/>
        <input type="text" name="subjectName" placeholder="საგანი"/>
        <input type="text" name="teacherUsername" placeholder="მასწავლებლის იუზერნეიმი"/>
        <input type="text" name="dayOfWeek" placeholder="დღე"/>
        <input type="time" name="startTime"/>
        <input type="time" name="endTime"/>
        <input type="text" name="roomNumber" placeholder="ოთახის ნომერი"/>
        <button type="submit">შექმნა</button>
    </form>

    <hr>

    <h3>გამოცდის დანიშვნა</h3>
    <form th:action="@{/admin/groups/exam/create}" method="post">
        <input type="text" name="groupName" placeholder="ჯგუფის სახელი"/>
        <input type="text" name="subjectName" placeholder="საგანი"/>
        <input type="text" name="title" placeholder="გამოცდის დასახელება"/>
        <input type="date" name="examDate"/>
        <input type="number" name="maxScore" placeholder="მაქსიმალური ქულა"/>
        <button type="submit">შექმნა</button>
    </form>

    <hr>

    <h3>სტუდენტის ჯგუფში ჩამატება</h3>
    <form th:action="@{/admin/groups/students/add}" method="post">
        <input type="text" name="studentUsername" placeholder="სტუდენტის იუზერნეიმი" required><br>
        <input type="text" name="groupName" placeholder="ჯგუფის სახელი" required><br>
        <button type="submit">დამატება</button>
    </form>
